spring.application.name=gateway

# The only service meant to be reached by users. Bind to 0.0.0.0 to expose it on your network, or put a
# TLS-terminating reverse proxy / tunnel in front. There is no authentication yet, so keep it private.
server.port=8080
server.address=127.0.0.1

# Where to route traffic. /builder/** goes to the builder, /api/** goes to the runtime.
gateway.builder-url=http://127.0.0.1:8081
gateway.runtime-url=http://127.0.0.1:8082
