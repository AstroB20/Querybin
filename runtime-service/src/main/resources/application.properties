spring.application.name=runtime-service

# No authentication yet, so the service only listens on this machine. The gateway is the public entry point.
server.port=8082
server.address=127.0.0.1

# The runtime shares the builder's database (AUTO_SERVER) but only ever reads the target schema; it never
# touches the BUILDER metadata. The builder owns schema creation, so initialisation is disabled here.
spring.datasource.url=jdbc:h2:file:~/.api-builder/apibuilder;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.sql.init.mode=never

app.target-schema=PUBLIC

# Where the builder service lives, used to resolve the definition behind each published API.
builder.base-url=http://127.0.0.1:8081

spring.mvc.problemdetails.enabled=true
