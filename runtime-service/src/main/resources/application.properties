spring.application.name=runtime-service

# The data plane: it serves the published APIs that engineers call. No authentication, so it can be
# shared. It only ever reads the target database.
server.port=8081
server.address=127.0.0.1

# The target database, the same one the builder points at. The runtime only ever reads it, so give it
# a read-only account. The default is the local H2 demo database that the builder creates.
spring.datasource.url=jdbc:h2:file:~/.api-builder/demo;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.hikari.read-only=true
spring.sql.init.mode=never

# Must match the builder's setting. Empty means the connection's default schema.
app.target-schema=

# Where the builder (control plane) lives, used to resolve the definition behind each published API.
builder.base-url=http://127.0.0.1:8080

# Must match the builder's app.internal-token when that is set.
builder.internal-token=

# Published APIs are read-only and meant to be called from anywhere (curl, other apps, the builder UI).
app.cors-allowed-origins=*

spring.mvc.problemdetails.enabled=true