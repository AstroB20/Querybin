spring.application.name=builder-service

# The control plane: the DBA designs and publishes APIs here. It is admin-only, so deploy it privately
# (a trusted network, a VPN or localhost). This is the page you open in a browser.
server.port=8080
server.address=127.0.0.1

# The admin login that protects the builder and its web page. Change these before deploying.
app.admin.username=admin
app.admin.password=admin

# The target database: the one whose tables are turned into APIs. The builder only reads it (schema
# lookups and previews). Point this at your own PostgreSQL, MySQL/MariaDB or H2 database.
# The default is a local H2 demo database that the runtime service shares through AUTO_SERVER.
spring.datasource.url=jdbc:h2:file:~/.api-builder/demo;AUTO_SERVER=TRUE
spring.datasource.username=sa

# Creates and seeds the sample tables in the demo database. Set to "never" for a real target database.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sample-schema.sql
spring.sql.init.data-locations=classpath:sample-data.sql

# The schema (PostgreSQL, H2) or database (MySQL, MariaDB) that published APIs may read.
# Empty means the connection's default.
app.target-schema=

# The builder's own storage for published APIs and their history: an embedded H2 file, separate from
# the target database.
app.metadata.url=jdbc:h2:file:~/.api-builder/metadata

# Published APIs are served by the runtime service, so generated curl commands point there.
app.public-base-url=http://localhost:8081

# Optional shared secret for the service-to-service /internal endpoint. When set, the runtime must send
# the same value. Leave empty only on a trusted private network.
app.internal-token=

spring.mvc.problemdetails.enabled=true