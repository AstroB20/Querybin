spring.application.name=builder-service

# No authentication yet, so the service only listens on this machine. The gateway is the public entry point.
server.port=8081
server.address=127.0.0.1

# The builder owns the database: it stores its own metadata (BUILDER schema) and, for this demo, the
# sample tables that published APIs read. AUTO_SERVER lets the runtime service share the same file.
# Point this at your own database (and set app.target-schema) to expose real data.
spring.datasource.url=jdbc:h2:file:~/.api-builder/apibuilder;AUTO_SERVER=TRUE
spring.datasource.username=sa

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sample-schema.sql,classpath:builder-schema.sql
spring.sql.init.data-locations=classpath:sample-data.sql

# The schema that published APIs are allowed to read. The BUILDER metadata schema is never exposed.
app.target-schema=PUBLIC

# Published APIs are served through the gateway, so curl commands must point at it.
app.public-base-url=http://localhost:8080

spring.mvc.problemdetails.enabled=true
