spring.datasource.url=jdbc:h2:mem:builder-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sample-schema.sql,classpath:builder-schema.sql
spring.sql.init.data-locations=classpath:sample-data.sql

app.target-schema=PUBLIC
app.public-base-url=http://localhost

spring.mvc.problemdetails.enabled=true
