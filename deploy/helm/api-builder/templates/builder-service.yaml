apiVersion: v1
kind: Service
metadata:
  name: {{ include "api-builder.builderName" . }}
  labels:
    {{- include "api-builder.labels" . | nindent 4 }}
    app.kubernetes.io/name: builder
    app.kubernetes.io/component: builder
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: builder
