{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-builder.secretName" . }}
  labels:
    {{- include "api-builder.labels" . | nindent 4 }}
type: Opaque
stringData:
  adminPassword: {{ required "builder.adminPassword is required unless secrets.existingSecret is set" .Values.builder.adminPassword | quote }}
  targetDbPassword: {{ .Values.targetDatabase.password | quote }}
  internalToken: {{ .Values.secrets.internalToken | quote }}
{{- end }}
