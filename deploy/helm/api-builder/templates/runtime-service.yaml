apiVersion: v1
kind: Service
metadata:
  name: {{ include "api-builder.runtimeName" . }}
  labels:
    {{- include "api-builder.labels" . | nindent 4 }}
    app.kubernetes.io/name: runtime
    app.kubernetes.io/component: runtime
spec:
  type: {{ .Values.runtime.service.type }}
  ports:
    - name: http
      port: 8081
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: runtime
